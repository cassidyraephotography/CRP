<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="paper-wash">
      <feTurbulence type="fractalNoise" baseFrequency=".021" numOctaves="4" seed="31" stitchTiles="stitch"/>
    </filter>
    <filter id="paper-tooth">
      <feTurbulence type="fractalNoise" baseFrequency=".11" numOctaves="3" seed="47" stitchTiles="stitch"/>
    </filter>
    <filter id="paper-grain">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="19" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#faf9f6"/>
  <rect width="512" height="512" fill="#77736b" filter="url(#paper-wash)" opacity=".105"/>
  <rect width="512" height="512" fill="#827d73" filter="url(#paper-tooth)" opacity=".09"/>
  <rect width="512" height="512" fill="#77736b" filter="url(#paper-grain)" opacity=".055"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="480" height="100" viewBox="0 0 480 100" fill="none">
  <defs>
    <linearGradient id="petal-pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff1e8" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#e9a6ac" stop-opacity=".65"/>
      <stop offset="1" stop-color="#c67986" stop-opacity=".46"/>
    </linearGradient>
    <linearGradient id="petal-blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f3f1ec" stop-opacity=".8"/>
      <stop offset=".58" stop-color="#a9bdd1" stop-opacity=".68"/>
      <stop offset="1" stop-color="#788eaa" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="petal-gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff5d7" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#e7ce8e" stop-opacity=".7"/>
      <stop offset="1" stop-color="#c5a15c" stop-opacity=".5"/>

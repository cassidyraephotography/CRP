    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b9c3a2" stop-opacity=".64"/>
      <stop offset="1" stop-color="#738568" stop-opacity=".76"/>
    </linearGradient>
    <filter id="watercolor" x="-35%" y="-35%" width="170%" height="170%">
      <feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="2" seed="13" result="pigment"/>
      <feDisplacementMap in="SourceGraphic" in2="pigment" scale="4" xChannelSelector="R" yChannelSelector="G" result="paint-edge"/>
      <feGaussianBlur in="paint-edge" stdDeviation=".32" result="soft-edge"/>
      <feColorMatrix in="pigment" type="saturate" values="0" result="grain"/>
      <feComponentTransfer in="grain" result="fine-grain">
        <feFuncA type="table" tableValues="0 .14"/>
      </feComponentTransfer>
      <feComposite in="fine-grain" in2="soft-edge" operator="in" result="pigment-grain"/>
      <feBlend in="soft-edge" in2="pigment-grain" mode="multiply"/>
    </filter>
    <g id="daisy">
